min_version = "2026.10.4"

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
hk = "2.11.1"
# hk's check and fix hooks run jactionlint, which runs shellcheck over every `run:` script. Renovate
# does not know mise's `jactionlint` shorthand, so the backend is spelled out.
"aqua:jdx/jactionlint" = "2.5.0"
node = "26"
shellcheck = "0.11.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install development dependencies and git hooks"
run = [
    "npm ci --quiet --no-fund --no-audit",
    # pi must always resolve to the global install, never this repo's copy
    "rm -f node_modules/.bin/pi",
    "hk install --mise --quiet",
]
sources = ["mise.toml", "hk.pkl", "package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
quiet = true

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:biome"]
description = "Lint TypeScript, JSON, and Markdown"
run = "biome check ."

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "hk check --all --step jactionlint"

# `npm ci` installs a lockfile without resolving it again, so CI would pass one that `npm install`,
# which Renovate runs, can no longer resolve. This resolves it with the repo's npm and fails if that
# changes it.
[tasks."lint:lockfile"]
description = "Check that package-lock.json still resolves to itself"
run = [
    "npm install --package-lock-only --ignore-scripts --no-audit --no-fund",
    "git diff --exit-code package-lock.json",
]

[tasks."lint:release"]
description = "Check the changelog's headings and that its newest release matches every package.json"
run = "node scripts/check-release.mjs"

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "shellcheck -x -P SCRIPTDIR .agents/setup .agents/resume scripts/*.sh tests/*.sh tests/lib/*.sh"

# Renovate's tasks run under MISE_ENV=renovate, whose mise.renovate.toml overlays Renovate and the
# Node it supports, so its install stays out of every bootstrap and mise both installs and runs it
# on that Node: re2, Renovate's native regex engine, is built for the Node that installs it and
# refuses to load in another, leaving validation on JavaScript RegExp with only a warning. `mise x`
# also puts that Node ahead of a Homebrew one already on PATH.
[tasks.renovate]
description = "Run Renovate"
run = "MISE_ENV=renovate mise x -- renovate"

[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "MISE_ENV=renovate mise x -- renovate-config-validator renovate.json"

[tasks.format]
description = "Format and apply safe fixes"
run = ["biome check --write .", "hk fix --all --step jactionlint"]

[tasks.release]
description = "Release CHANGELOG.md's Unreleased entries as X.Y.Z: version, commit, tag and push"
usage = 'arg "<version>" help="The version to release, X.Y.Z"'
run = "node scripts/release.mjs {{usage.version}}"

[tasks.build]
description = "Build all publishable packages in dependency order"
run = [
    "tsc -p packages/doppelclaude",
    "tsc -p packages/pi-doppelclaude",
    "tsc -p packages/http-doppelclaude",
]

[tasks.typecheck]
description = "Type-check TypeScript"
run = "mise run build && tsc --noEmit"

[tasks.test]
description = "Run the full test suite (hits live APIs)"
run = "set -a && [ -f .env.test ] && . ./.env.test; set +a && mise run test:unit && tests/int-smoke.sh && tests/int-settings.sh && tests/int-multi-turn.sh && tests/int-cache.sh && node --import tsx --test tests/int-*.ts"

[tasks."test:unit"]
description = "Run the offline unit tests"
run = "mise run build && node --import tsx --test tests/unit-*.ts"

[tasks."test:usage"]
description = "On-demand subscription-usage diagnostic (rate-limited endpoint)"
run = "node --import tsx tests/usage-test.ts"

[tasks.check]
description = "Run offline verification (integration tests via `mise run test` hit live APIs)"
depends = ["lint", "typecheck", "test:unit"]
