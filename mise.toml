min_version = "2026.7.4"

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
actionlint = "1.7.12"
hk = "1.58.1"
node = "24"
shellcheck = "0.11.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install development dependencies and git hooks"
run = [
    "npm ci --quiet --no-fund --no-audit",
    # pi must always resolve to the global install, never this repo's copy
    "rm -f node_modules/.bin/pi",
    "hk install --mise --quiet",
    "mkdir -p .mise && touch .mise/bootstrap",
]
sources = ["mise.toml", "hk.pkl", "package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json", ".mise/bootstrap"]
quiet = true

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:biome"]
description = "Lint TypeScript and JSON"
run = "biome check ."

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "shellcheck -x -P SCRIPTDIR .agents/setup .agents/resume scripts/*.sh tests/*.sh tests/lib/*.sh"

# Renovate's bin shim ends in `exec node`, and mise builds a task's PATH from the shell's
# pre-activation ordering, which on a Homebrew machine starts at /opt/homebrew/bin -- ahead of the
# node this task declares. re2 is then compiled by mise's node and loaded by Homebrew's, which
# fails the ABI check and downgrades regex validation to JavaScript RegExp with only a warning.
# Naming the interpreter is the same move UV_PYTHON makes in ansiblonomicon.
[tasks.renovate]
description = "Run Renovate"
run = "PATH=\"{{ tools.node.path }}/bin:$PATH\" renovate"
tools.node = "24"
tools."npm:renovate" = { version = "44.29.4", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "PATH=\"{{ tools.node.path }}/bin:$PATH\" renovate-config-validator renovate.json"
tools.node = "24"
tools."npm:renovate" = { version = "44.29.4", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

[tasks.format]
description = "Format and apply safe fixes"
run = "biome check --write ."

[tasks.build]
description = "Build all publishable packages in dependency order"
run = [
    "tsc -p packages/doppelclaude",
    "tsc -p packages/pi-doppelclaude",
    "tsc -p packages/http-doppelclaude",
]

[tasks.typecheck]
description = "Type-check TypeScript"
run = "mise run build && tsc --noEmit"

[tasks.test]
description = "Run the full test suite (hits live APIs)"
run = "set -a && [ -f .env.test ] && . ./.env.test; set +a && mise run test:unit && tests/int-smoke.sh && tests/int-settings.sh && tests/int-multi-turn.sh && tests/int-cache.sh && node --import tsx --test tests/int-*.ts"

[tasks."test:unit"]
description = "Run the offline unit tests"
run = "mise run build && node --import tsx --test tests/unit-*.ts"

[tasks."test:usage"]
description = "On-demand subscription-usage diagnostic (rate-limited endpoint)"
run = "node --import tsx tests/usage-test.ts"

[tasks.check]
description = "Run offline verification (integration tests via `mise run test` hit live APIs)"
depends = ["lint", "typecheck", "test:unit"]
