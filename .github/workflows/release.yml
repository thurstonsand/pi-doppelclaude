name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish npm package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: false

      - name: Set synchronized package versions from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/set-release-version.mjs "$version"
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build and pack dry run
        run: |
          mise run build
          npm pack --dry-run --workspace doppelclaude
          npm pack --dry-run --workspace pi-doppelclaude
          npm pack --dry-run --workspace http-doppelclaude

      - name: Publish core first, then frontends
        run: |
          npm publish --workspace doppelclaude --access public --tag latest
          npm publish --workspace pi-doppelclaude --access public --tag latest
          npm publish --workspace http-doppelclaude --access public --tag latest
