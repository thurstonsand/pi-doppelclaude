name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
          cache: false

      - name: Check that the tag, package.json files and changelog agree
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish npm package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and pack dry run
        run: |
          mise run build
          npm pack --dry-run --workspace doppelclaude
          npm pack --dry-run --workspace pi-doppelclaude
          npm pack --dry-run --workspace http-doppelclaude

      - name: Publish core first, then frontends
        run: |
          npm publish --workspace doppelclaude --access public --tag latest
          npm publish --workspace pi-doppelclaude --access public --tag latest
          npm publish --workspace http-doppelclaude --access public --tag latest
