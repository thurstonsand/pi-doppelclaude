name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish npm package
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Set synchronized package versions from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/set-release-version.mjs "$version"
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build and pack dry run
        run: |
          mise run build
          npm pack --dry-run --workspace doppelclaude
          npm pack --dry-run --workspace pi-doppelclaude
          npm pack --dry-run --workspace http-doppelclaude

      - name: Publish core first, then frontends
        run: |
          npm publish --workspace doppelclaude --access public --tag latest
          npm publish --workspace pi-doppelclaude --access public --tag latest
          npm publish --workspace http-doppelclaude --access public --tag latest
