name: Container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thurstonsand/http-doppelclaude
  LOCAL_IMAGE: http-doppelclaude:tested

jobs:
  check:
    name: Check repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: mise run check

  build-and-smoke:
    name: Build and smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Select package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
      - name: Smoke test image
        run: scripts/smoke-http-image.sh "$LOCAL_IMAGE"
      - name: Save tested image
        if: github.event_name == 'push'
        run: docker save "$LOCAL_IMAGE" | gzip > http-doppelclaude-image.tar.gz
      - name: Upload tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-http-doppelclaude-image
          path: http-doppelclaude-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-and-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tested-http-doppelclaude-image
      - name: Load tested image
        run: gzip --decompress --stdout http-doppelclaude-image.tar.gz | docker load
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish
        shell: bash
        run: |
          tags=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$IMAGE:${GITHUB_REF_NAME#v}" "$IMAGE:release-sha-$GITHUB_SHA")
          else
            tags+=("$IMAGE:main-sha-$GITHUB_SHA")
          fi
          for tag in "${tags[@]}"; do
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
          done
