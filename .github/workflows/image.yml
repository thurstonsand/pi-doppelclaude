name: Container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to rebuild from its existing vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

# Pull requests cancel their superseded runs; publishing runs queue instead, so a release is never cut
# off halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/thurstonsand/http-doppelclaude
  LOCAL_IMAGE: http-doppelclaude:tested

jobs:
  check:
    name: Check repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: false
      - name: Check that the tag, package.json files and changelog agree
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: mise run check

  build-and-smoke:
    name: Build and smoke test (${{ matrix.platform }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Read package version
        id: version
        run: echo "value=$(jq -r .version packages/http-doppelclaude/package.json)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.LOCAL_IMAGE }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Smoke test image
        run: scripts/smoke-http-image.sh "$LOCAL_IMAGE-${{ matrix.architecture }}"
      - name: Save tested image
        if: github.event_name != 'pull_request'
        shell: bash
        run: >-
          docker save "$LOCAL_IMAGE-${{ matrix.architecture }}" |
          gzip > "http-doppelclaude-image-${{ matrix.architecture }}.tar.gz"
      - name: Upload tested image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-http-doppelclaude-image-${{ matrix.architecture }}
          path: http-doppelclaude-image-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-http-doppelclaude-image-*
          merge-multiple: true
      - name: Load tested image
        shell: bash
        run: |
          for archive in http-doppelclaude-image-*.tar.gz; do
            gzip --decompress --stdout "$archive" | docker load
          done
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source_sha=$(git rev-parse HEAD)
          tags=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            component_prefix="release-sha-$source_sha"
            tags+=("$IMAGE:$INPUT_VERSION" "$IMAGE:$component_prefix" "$IMAGE:latest")
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            component_prefix="release-sha-$source_sha"
            tags+=("$IMAGE:${GITHUB_REF_NAME#v}" "$IMAGE:$component_prefix" "$IMAGE:latest")
          else
            component_prefix="main-sha-$source_sha"
            tags+=("$IMAGE:$component_prefix")
          fi

          components=()
          for architecture in amd64 arm64; do
            component="$IMAGE:$component_prefix-$architecture"
            docker tag "$LOCAL_IMAGE-$architecture" "$component"
            docker push "$component"
            components+=("$component")
          done

          manifest_args=()
          for tag in "${tags[@]}"; do
            manifest_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${manifest_args[@]}" "${components[@]}"
